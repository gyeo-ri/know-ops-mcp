# Claude Code — on-demand AI assistance / code review on PRs and issues.
#
# Triggers only when a comment, review, or issue body mentions @claude, so it
# never runs on its own. To get a code review, comment on a PR, e.g.:
#   @claude review this PR for bugs and anything that breaks the conventions in AGENTS.md
# Claude can also answer questions, implement fixes, and push commits when asked.
#
# Prerequisites (one-time, repo admin):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#      (or run `/install-github-app` in the Claude Code CLI, which does both steps)
#   2. Add an ANTHROPIC_API_KEY repository secret (Settings → Secrets → Actions).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 10"
